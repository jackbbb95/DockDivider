name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 is the oldest hosted image available. It exercises the
        # deployment-target runtime without requiring a local VM.
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild \
            -project DockDivider.xcodeproj \
            -scheme DockDivider \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:DockDividerTests \
            -resultBundlePath "$RUNNER_TEMP/DockDividerTests.xcresult" \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Collect crash logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crashlogs"
          cp "$HOME/Library/Logs/DiagnosticReports/"*.ips "$RUNNER_TEMP/crashlogs/" 2>/dev/null || true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/DockDividerTests.xcresult
            ${{ runner.temp }}/crashlogs
          retention-days: 7

      - name: Build universal Release
        if: matrix.os == 'macos-15'
        run: |
          xcodebuild \
            -project DockDivider.xcodeproj \
            -scheme DockDivider \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO
