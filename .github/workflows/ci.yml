name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          xcodebuild \
            -project DockDivider.xcodeproj \
            -scheme DockDivider \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:DockDividerTests \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal Release
        run: |
          xcodebuild \
            -project DockDivider.xcodeproj \
            -scheme DockDivider \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO
